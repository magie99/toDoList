<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <div id="sidebar">
        <h3>my todo list</h3>
        <button command="show-modal" commandfor="addProjectDialog">new project</button>
        <ul id="project-list"></ul>
    </div>
    <div id="project-container">
        <div id="project-header">
            <h3 id="project-title">default</h3>
            <button command="show-modal" commandfor="addToDo-dialog" id="addToDoBtn">add to do</button>
            <dialog id="addToDo-dialog">
                <form id="addToDoForm">
                    <label for="title">Title</label>
                    <input type="text" name="title"required>
                    <label for="dueDate">Due Date</label>
                    <input type="date" name="dueDate">
                    <label for="priority">Priority</label>
                    <input type="range" name="priority" min="1" max="10">
                    <button type="submit">submit</button>
                    <button type="button" class="btn-cancel">cancel</button>
                 </form>
            </dialog>
        </div>
        <div id="to-do-container"></div>
    </div>
    <dialog id="moreDialog">
        <button id="moreDetails">details</button>
        <button id="moreEdit">edit</button>
        <button id="moreDelete">delete</button>
    </dialog>
    <dialog id="addProjectDialog">
        <form id="addProjectForm">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" value="title" required>
            <button type="submit">submit</button>
            <button type="button" class="btn-cancel">cancel</button>
        </form>
    </dialog>
</body>
</html>
